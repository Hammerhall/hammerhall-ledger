name: Примеры статей

# Код из «Пример целиком» каждой статьи собирается и запускается.
# Каждый пример — своя задача, они идут параллельно.
# Красный прогон — статья на сайт не выходит.

on:
  push:
    paths:
      - "articles/**"
      - "testing/**"
      - "examples/**"
      - "tools/**"
      - ".github/workflows/examples.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    name: Список примеров
    runs-on: ubuntu-24.04
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        name: Найти examples/**/example.json
        run: |
          examples=$(cd examples && find . -name example.json -printf '%h\n' | sed 's#^\./##' | sort \
            | python3 -c 'import json, sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')
          echo "examples=$examples" >>"$GITHUB_OUTPUT"
          echo "Примеры: $examples"

  example:
    name: ${{ matrix.example }}
    needs: list
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.list.outputs.examples) }}
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      EXAMPLE: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Разложить пример из статьи
        run: python3 tools/extract_examples.py "$EXAMPLE"

      - name: Собрать и проверить
        run: bash tools/run_examples.sh "$EXAMPLE"
